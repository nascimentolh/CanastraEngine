[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
canastra-data = { path = "crates/canastra-data" }
canastra-db = { path = "crates/canastra-db" }
canastra-migrate = { path = "crates/canastra-migrate" }
canastra-net = { path = "crates/canastra-net" }
canastra-protocol = { path = "crates/canastra-protocol" }
canastra-ui = { path = "crates/canastra-ui" }
l2-catalog = { path = "crates/l2-catalog" }
l2-crypto = { path = "crates/l2-crypto" }
l2-dat = { path = "crates/l2-dat" }
l2-dat-h5 = { path = "crates/l2-dat-h5" }
l2-env = { path = "crates/l2-env" }
ue2-assets = { path = "crates/ue2-assets" }
ue2-core = { path = "crates/ue2-core" }
ue2-level = { path = "crates/ue2-level" }
ue2-package = { path = "crates/ue2-package" }
argon2 = "0.6"
eframe = "0.36"
ed25519-dalek = "3"
flate2 = "1"
getrandom = "0.4"
glyphon = "0.12"
hex = "0.4"
num-bigint = "0.4"
pollster = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
snow = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
taffy = "0.14"
tokio = "1"
wgpu = "30"
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Client files are untrusted input: failures must surface as errors, not panics.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
# Error enums are the documentation for fallible functions.
missing_errors_doc = "allow"
must_use_candidate = "allow"
