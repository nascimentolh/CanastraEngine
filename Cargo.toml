[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
canastra-data = { path = "crates/canastra-data" }
canastra-migrate = { path = "crates/canastra-migrate" }
l2-crypto = { path = "crates/l2-crypto" }
l2-dat = { path = "crates/l2-dat" }
l2-dat-h5 = { path = "crates/l2-dat-h5" }
ue2-assets = { path = "crates/ue2-assets" }
ue2-core = { path = "crates/ue2-core" }
ue2-package = { path = "crates/ue2-package" }
eframe = "0.36"
flate2 = "1"
num-bigint = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Client files are untrusted input: failures must surface as errors, not panics.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
# Error enums are the documentation for fallible functions.
missing_errors_doc = "allow"
must_use_candidate = "allow"
