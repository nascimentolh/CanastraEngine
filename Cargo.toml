[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
l2-crypto = { path = "crates/l2-crypto" }
ue2-core = { path = "crates/ue2-core" }
flate2 = "1"
num-bigint = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Client files are untrusted input: failures must surface as errors, not panics.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
# Error enums are the documentation for fallible functions.
missing_errors_doc = "allow"
must_use_candidate = "allow"
