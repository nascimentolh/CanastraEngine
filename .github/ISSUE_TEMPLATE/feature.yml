name: Feature or idea
description: Propose something new or a change in direction
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it would work, and how it fits docs/decisions.md.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself
