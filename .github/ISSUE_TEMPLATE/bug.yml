name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you ran or clicked, in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: client, login server, game server, Studio, canastra CLI
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and GPU
      placeholder: Windows 11, RTX 3060
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste the full output; do not include keys or passwords.
